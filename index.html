<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>SC 빌드오더 연습기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="startScreen" class="start-screen">
  <h1>SC 빌드오더 연습기</h1>
  <p class="start-sub">종족과 연습할 빌드오더를 선택하세요</p>
  <div class="start-step" id="startRaceStep">
    <h2>1. 종족 선택</h2>
    <div class="start-race-grid" id="startRaceGrid"></div>
  </div>
  <div class="start-step" id="startBoStep" style="display:none">
    <h2>2. 빌드오더 선택</h2>
    <div class="start-bo-list" id="startBoList"></div>
    <button id="startGoBtn" class="start-go-btn" disabled>시작</button>
  </div>
</div>

<div id="app" style="display:none">

  <header class="topbar">
    <div class="topbar-select">
      <select id="raceSelect" aria-label="종족 선택"></select>
      <select id="boSelect" aria-label="빌드오더 선택"></select>
      <button id="menuBtn" class="resetbtn" title="시작화면으로">메뉴</button>
    </div>
    <div class="resources" id="resources">
      <span class="res res-mineral"><i class="dot dot-mineral"></i><b id="rMinerals">50</b><small id="rMineralRate">+0.0/초</small></span>
      <span class="res res-gas"><i class="dot dot-gas"></i><b id="rGas">0</b><small id="rGasRate">+0.0/초</small></span>
      <span class="res res-supply"><i class="dot dot-supply"></i><b id="rSupply">4/10</b></span>
      <span class="res res-workers"><i class="dot dot-worker"></i><b id="rWorkers">4</b></span>
      <span class="res res-time"><i class="dot dot-time"></i><b id="rTime">0:00</b></span>
    </div>
    <div class="topbar-controls">
      <div class="speedgroup" id="speedGroup">
        <button data-speed="0" class="spdbtn">II</button>
        <button data-speed="1" class="spdbtn active">1x</button>
        <button data-speed="2" class="spdbtn">2x</button>
        <button data-speed="4" class="spdbtn">4x</button>
        <button data-speed="8" class="spdbtn">8x</button>
      </div>
      <button id="resetBtn" class="resetbtn">초기화</button>
    </div>
  </header>

  <section class="baseview-wrap" id="baseviewWrap">
    <div class="bv-scene" id="bvScene"></div>
    <div class="bv-gallery" id="bvGallery"></div>
  </section>

  <main class="stage">
    <section class="panel panel-bo" aria-label="빌드오더 체크리스트">
      <h2>빌드오더 체크리스트</h2>
      <p class="bo-note">※ 목록의 인구수는 유닛/건물을 생산 큐에 넣는 즉시(완성 전이라도) 반영되는 값입니다. 목록에 없는
        구간에도 인구수가 남는 한 일꾼 생산은 계속 유지하세요.</p>
      <p class="bo-desc" id="boDesc"></p>
      <p class="bo-tip" id="boTip"></p>
      <ol class="bo-list" id="boList"></ol>
    </section>

    <section class="panel panel-info" aria-label="현황">
      <h2>보유 유닛</h2>
      <div class="unit-grid" id="unitStatus"></div>
      <h3>최근 행동</h3>
      <ul class="log-list" id="logList"></ul>
    </section>

    <section class="panel panel-cmd" aria-label="커맨드 카드">
      <div class="cmd-row gasrow" id="gasRow">
        <span>가스 일꾼</span>
        <button id="gasMinus" class="stepbtn">-</button>
        <b id="gasCount">0</b>
        <button id="gasPlus" class="stepbtn">+</button>
        <small id="gasInfo"></small>
      </div>
      <div class="cmd-row scoutrow">
        <button id="scoutBtn" class="stepbtn">일꾼 정찰 보내기</button>
        <button id="recallScoutBtn" class="stepbtn" style="display:none">정찰 복귀</button>
      </div>
      <h3>건물 건설</h3>
      <div class="cmd-grid" id="buildGrid"></div>
      <h3>생산 <span class="hint-inline">(위 베이스 뷰에서 건물을 클릭)</span></h3>
      <div id="prodPanel"></div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
