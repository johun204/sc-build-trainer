<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>SC 빌드오더 연습기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="startScreen" class="start-screen">
  <h1>SC 빌드오더 연습기</h1>
  <p class="start-sub">종족과 연습할 빌드오더를 선택하세요</p>
  <div class="start-step" id="startRaceStep">
    <h2>1. 종족 선택</h2>
    <div class="start-race-grid" id="startRaceGrid"></div>
  </div>
  <div class="start-step" id="startBoStep" style="display:none">
    <h2>2. 빌드오더 선택</h2>
    <div class="start-bo-list" id="startBoList"></div>
    <button id="startGoBtn" class="start-go-btn" disabled>시작</button>
  </div>
</div>

<div id="app" style="display:none">

  <header class="topbar">
    <div class="topbar-select">
      <select id="raceSelect" aria-label="종족 선택"></select>
      <select id="boSelect" aria-label="빌드오더 선택"></select>
      <button id="menuBtn" class="iconbtn" title="시작화면으로">메뉴</button>
    </div>
    <div class="resources" id="resources">
      <span class="res res-mineral"><i class="dot dot-mineral"></i><b id="rMinerals">50</b></span>
      <span class="res res-gas"><i class="dot dot-gas"></i><b id="rGas">0</b></span>
      <span class="res res-supply"><i class="dot dot-supply"></i><b id="rSupply">4/10</b></span>
      <span class="res res-workers"><i class="dot dot-worker"></i><b id="rWorkers">4</b></span>
      <span class="res res-time"><i class="dot dot-time"></i><b id="rTime">0:00</b></span>
    </div>
    <div class="speedgroup" id="speedGroup">
      <button data-speed="0" class="spdbtn">II</button>
      <button data-speed="1" class="spdbtn active">1x</button>
      <button data-speed="2" class="spdbtn">2x</button>
      <button data-speed="4" class="spdbtn">4x</button>
      <button data-speed="8" class="spdbtn">8x</button>
      <button id="resetBtn" class="iconbtn" title="다시 시작">↺</button>
    </div>
  </header>

  <section class="baseview-wrap" id="baseviewWrap">
    <div class="bv-scene" id="bvScene"></div>
    <div class="bv-gallery" id="bvGallery"></div>
  </section>

  <nav class="tabbar" id="tabbar">
    <button class="tabbtn active" data-pane="checklist">체크리스트</button>
    <button class="tabbtn" data-pane="command">명령</button>
  </nav>

  <main class="tabcontent">
    <section class="tabpane active" id="paneChecklist" aria-label="빌드오더 체크리스트">
      <p class="bo-note">※ 목록의 인구수는 유닛/건물을 생산 큐에 넣는 즉시(완성 전이라도) 반영되는 값입니다. 목록에 없는
        구간에도 인구수가 남는 한 일꾼 생산은 계속 유지하세요.</p>
      <p class="bo-desc" id="boDesc"></p>
      <p class="bo-tip" id="boTip"></p>
      <ol class="bo-list" id="boList"></ol>
    </section>

    <section class="tabpane" id="paneCommand" aria-label="명령">
      <div class="selection-row" id="selectionRow"></div>
      <div id="cmdContent"></div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
